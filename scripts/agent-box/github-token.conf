# Drop-in for bwai-broker.service: give the broker its own GitHub token,
# separate from the user's own git credentials. Install as
# ~/.config/systemd/user/bwai-broker.service.d/github-token.conf and put
# GH_TOKEN=<token> in ~/.config/bwai/gh-token.env (mode 0600).
[Service]
EnvironmentFile=%h/.config/bwai/gh-token.env
# An empty helper resets the list from the user's config, so git pushes
# from the mirror authenticate with GH_TOKEN via gh and nothing else.
Environment=GIT_CONFIG_COUNT=2
Environment=GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
Environment="GIT_CONFIG_KEY_1=credential.helper" "GIT_CONFIG_VALUE_1=!gh auth git-credential"
